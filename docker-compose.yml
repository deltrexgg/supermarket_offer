# PostgreSQL, image storage (S3) and login are hosted on Supabase, so there is no
# database container here. Put your Supabase settings in .env (see .env.example).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (Supabase session pooler URL)}
      REDIS_ADDR: redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      CHROME_PATH: /usr/bin/chromium
      GIN_MODE: release
      # true = insert demo data (only into an empty database) and create the demo logins
      SEED: ${SEED:-false}
      # Supabase Auth: the API verifies access tokens and creates users (service role key stays here only)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Supabase Storage through its S3-compatible API
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-offer-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PUBLIC_FILE_BASE_URL: ${PUBLIC_FILE_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
    # Chromium needs more than the default 64MB of shared memory
    shm_size: "1gb"
    ports:
      - "8080:8080"

  web-portal:
    build:
      context: ./web-portal
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  web-public:
    build:
      context: ./web-public
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  redisdata:
